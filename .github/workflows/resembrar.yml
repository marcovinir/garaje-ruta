name: Resembrar datos de ejemplo

# Lunes y jueves a las 3:00 de Costa Rica (9:00 UTC): deja la demo limpia (cualquiera puede
# entrar con el usuario demo) y, de paso, evita que Supabase gratis se pause por llevar ~7 días
# sin uso. Hasta que exista la base de producción termina en verde sin hacer nada.
# `sembrar --reiniciar` borra los artículos y los usuarios que no sean el admin (los invitados
# desde el panel desaparecen; colaborador y demo se vuelven a crear). La configuración del negocio
# (WhatsApp, dirección, horario) no se toca.
on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

concurrency:
  group: base-de-produccion
  cancel-in-progress: false

jobs:
  resembrar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRACIONES }}
      SEMILLA_PASSWORD: ${{ secrets.SEMILLA_PASSWORD }}
      SEMILLA_PASSWORD_DEMO: ${{ secrets.SEMILLA_PASSWORD_DEMO }}
      # El mismo de Vercel: al terminar se avisa a Next para que muestre los datos nuevos.
      REVALIDACION_SECRETO: ${{ secrets.REVALIDACION_SECRETO }}
      FRONTEND_URL: https://garajeruta.marcovinir.dev
      # Obligatorias en producción pero sin efecto en estos comandos.
      SECRET_KEY: solo-para-comandos-de-gestion
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://garajeruta.marcovinir.dev
      PANEL_RUTA: /panel
      EMAIL_HOST_PASSWORD: sin-efecto-en-estos-comandos
      DEFAULT_FROM_EMAIL: Garaje Ruta <garaje@marcovinir.dev>
    steps:
      - name: ¿Hay base de producción?
        id: base
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Sin base de producción todavía: no se hace nada."
            echo "lista=false" >> "$GITHUB_OUTPUT"
          else
            echo "lista=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.lista == 'true'
        uses: actions/checkout@v4
      - if: steps.base.outputs.lista == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.base.outputs.lista == 'true'
        run: pip install -r requirements.txt
      - if: steps.base.outputs.lista == 'true'
        run: python manage.py sembrar --reiniciar
      - if: steps.base.outputs.lista == 'true'
        run: python manage.py actualizar_tipo_cambio
      - name: Avisar a Next que los datos cambiaron
        if: ${{ always() && steps.base.outputs.lista == 'true' && env.REVALIDACION_SECRETO != '' }}
        run: |
          curl -sS --fail-with-body -X POST "$FRONTEND_URL/api/revalidar"             -H "Authorization: Bearer $REVALIDACION_SECRETO"             -H "Content-Type: application/json"             -d '{"etiquetas": ["articulos", "catalogos", "configuracion"]}'             || echo "::warning::No se pudo avisar a Next; se pondrá al día con su caché."
