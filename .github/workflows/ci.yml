name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garaje_ruta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/garaje_ruta
      SECRET_KEY: ci-no-secreta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
      - name: check --deploy (settings de producción)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.produccion
          SECRET_KEY: ci-una-clave-larga-solo-para-revisar-los-settings-0123456789abcdef
          ALLOWED_HOSTS: garaje-ruta-api.vercel.app
          CSRF_TRUSTED_ORIGINS: https://garajeruta.marcovinir.dev
          FRONTEND_URL: https://garajeruta.marcovinir.dev
          PANEL_RUTA: /panel
          EMAIL_HOST_PASSWORD: sin-efecto-en-este-comando
          DEFAULT_FROM_EMAIL: Garaje Ruta <garaje@marcovinir.dev>
          REVALIDACION_SECRETO: ci-no-secreto

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garaje_ruta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Django (settings locales: semilla con la clave local, correo a la consola).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/garaje_ruta
      DJANGO_SETTINGS_MODULE: config.settings.local
      ALMACEN_FOTOS: apps.articulos.fotos.AlmacenFotosMemoria
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      # Compartidos entre Django y Next, solo para esta prueba.
      REVALIDACION_SECRETO: e2e
      SERVIDOR_NEXT_SECRETO: e2e
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Base y datos de ejemplo
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable
          python manage.py sembrar
      - name: Django en segundo plano
        working-directory: backend
        run: nohup python manage.py runserver 8000 > ../django.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Next en segundo plano
        working-directory: frontend
        run: nohup npx next start --port 3000 > ../next.log 2>&1 &
      - name: Esperar a que respondan
        run: |
          for i in $(seq 1 60); do
            curl -fs localhost:8000/api/v1/catalogos/ > /dev/null && curl -fs localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "No respondieron a tiempo"; tail -50 django.log next.log; exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        run: tail -100 django.log next.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: frontend/playwright-report
          retention-days: 7
